name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + types + tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # One macOS job. The user base for these tools is desktop-heavy, and on
        # the sibling Dominican project a Linux-only matrix hid a real platform
        # bug (macOS resolves $TMPDIR under /private/var).
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group dev --extra dev

      - name: Lint (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff check src/ tests/ sweep/

      - name: Format check (ruff)
        run: uv run --python ${{ matrix.python-version }} ruff format --check src/ tests/ sweep/

      - name: Type check (mypy)
        run: uv run --python ${{ matrix.python-version }} mypy src/colombian_open_data_mcp/ --no-error-summary

      - name: Verify package imports
        run: |
          uv run --python ${{ matrix.python-version }} python -c "
          from colombian_open_data_mcp import (
              server, socrata, soql, ckan, ckan_tools, retry, netguard, esri, tabular,
          )
          assert hasattr(server, 'mcp')
          assert hasattr(server, 'main')
          assert callable(socrata.SocrataClient)
          assert callable(ckan.CkanClient)
          assert callable(ckan_tools.register)
          assert callable(retry.get_with_retries)
          assert callable(soql.build_where)
          assert callable(netguard.assert_public_url)
          assert callable(esri.EsriClient)
          assert callable(tabular.read_resource_file)
          print('OK: all modules import cleanly')
          "

      # Live tests are deliberately NOT run here. Both portals are third-party
      # infrastructure, and Bogotá's sits behind a WAF that refuses shared IPs
      # more readily than residential ones. Run them locally with
      # RUN_LIVE_TESTS=1.
      - name: Run pytest + coverage (hermetic only)
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Verify tool registration
        run: |
          uv run --python ${{ matrix.python-version }} python -c "
          import asyncio
          from colombian_open_data_mcp.server import mcp
          from colombian_open_data_mcp import __version__, ckan
          tools = asyncio.run(mcp.list_tools())
          names = [t.name for t in tools]
          assert len(names) == 24, names
          # Twelve national tools plus twelve city_* ones covering four portals.
          # Before 0.4 this was eight tools per portal; four portals that way
          # would be forty-four schemas saying the same thing four times.
          assert sum(n.startswith('city_') for n in names) == 12, names
          assert len(ckan.PORTALS) == 4, sorted(ckan.PORTALS)
          # No tool may take a URL. The ESRI and file tools reach hosts this
          # source does not name, and that is only defensible because the
          # address comes from a portal catalogue rather than from an argument.
          for t in tools:
              props = set((t.input_schema or {}).get('properties') or {})
              assert not (props & {'url', 'uri', 'address', 'endpoint', 'host'}), t.name
          blank = [t.name for t in tools if not (t.description or '').strip()]
          assert not blank, f'tools with no description: {blank}'
          assert all(t.annotations and t.annotations.read_only_hint for t in tools)
          opts = mcp._lowlevel_server.create_initialization_options()
          assert opts.server_version == __version__, opts.server_version
          print(f'OK: {len(names)} tools, serverInfo.version={opts.server_version}')
          "

      - name: Verify entry point launches
        run: |
          uv run --python ${{ matrix.python-version }} colombian-open-data-mcp < /dev/null &
          PID=$!
          sleep 2
          if kill -0 $PID 2>/dev/null; then
            echo "OK: server launched"
            kill $PID
          else
            wait $PID
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              echo "OK: ran and exited cleanly on EOF"
            else
              echo "FAIL: died with exit $EXIT"
              exit 1
            fi
          fi

      - name: Build wheel + sdist
        run: uv build

      # The published binary is linux_amd64 and the file it checks is identical
      # on every runner, so validating once on Linux is both correct and enough.
      - name: Validate server.json against MCP Registry
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate
