[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colombian-open-data-mcp"
version = "0.5.0"
description = "MCP server for Colombia's open government data — the national datos.gov.co plus the Bogotá, Cali, Valle del Cauca and Cartagena portals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Attribution, not ownership transfer. The package and the registry namespace stay
# under the personal account for continuity with dominican-open-data-mcp, which is
# already published with eight versions under io.github.alcastaro. OLDS is named
# because the connector's purpose and the observatory's purpose are the same one,
# and because a directory reviewer asks who publishes it.
authors = [
    { name = "Alberto Castillo Aroca", email = "ai@olds2030.org" },
]
maintainers = [
    { name = "OLDS — Observatorio Latinoamericano de Desarrollo Sostenible", email = "ai@olds2030.org" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "open-data",
    "datos-abiertos",
    "colombia",
    "bogota",
    "cali",
    "valle-del-cauca",
    "cartagena",
    "arcgis",
    "esri-rest",
    "socrata",
    "soda-api",
    "ckan",
    "civic-tech",
    "gobierno-abierto",
    "mintic",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # v2 of the SDK, which this server migrated to in 0.5. The upper bound
    # stays because 2.0 is precedent: it renamed FastMCP to MCPServer and
    # replaced `mcp.server.fastmcp` with a stub that raises. A major bump can
    # do that again, and without a bound a fresh `uvx colombian-open-data-mcp`
    # would resolve it and die on the first import. The lockfile protects this
    # checkout, not anyone installing from PyPI. Do NOT relax this without
    # running the suite against the new major.
    "mcp>=2.1,<3",
    "httpx>=0.27",
    "truststore>=0.10",
    # Cartagena's catalogue is 34 XLSX resources out of 38, and Bogotá's
    # download avenue is a third Excel. Without this the file reader would be
    # CSV-only and would miss most of one portal outright.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Kept so `pip install .[dev]` works. The same names are repeated under
# [dependency-groups].dev below because `uv sync` with no flags installs
# groups but not extras — a contributor following the README on a clean
# checkout would otherwise get "fixture 'httpx_mock' not found" and
# reasonably conclude the server is broken.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    # Only used to assert the GitHub workflows parse. A release workflow that is
    # syntactically broken fails at the worst possible moment — after a tag is
    # pushed, on a version number PyPI will never let us reuse.
    "pyyaml>=6.0",
]

[project.scripts]
colombian-open-data-mcp = "colombian_open_data_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alcastaro/colombian-open-data-mcp"
Repository = "https://github.com/alcastaro/colombian-open-data-mcp"
Changelog = "https://github.com/alcastaro/colombian-open-data-mcp/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/alcastaro/colombian-open-data-mcp/issues"
Organization = "https://olds2030.org"
Portal = "https://www.datos.gov.co"
"Portal Bogotá" = "https://datosabiertos.bogota.gov.co"
"Portal Cali" = "https://datos.cali.gov.co"
"Portal Valle del Cauca" = "https://datosabiertos.valledelcauca.gov.co"
"Portal Cartagena" = "https://datosabiertos.cartagena.gov.co"

[tool.hatch.build.targets.wheel]
packages = ["src/colombian_open_data_mcp"]

# The source distribution is an allowlist, not a denylist, and that is
# deliberate. `uv build` does not honour nested .gitignore files, so a local
# tool directory that git has never tracked still ended up inside the published
# sdist — .code-review-graph/graph.db, an 852 KB SQLite database carrying
# absolute paths under the maintainer's home directory. It was 74% of the
# package. Naming what goes in means the next tool that drops a working
# directory here cannot repeat that.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/sweep",
    "/docs",
    "/README.md",
    "/README.es.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/LICENSE",
    "/server.json",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --cov=colombian_open_data_mcp --cov-report=term-missing --cov-fail-under=85"
markers = [
    "live: hits a real portal API (skipped unless RUN_LIVE_TESTS=1)",
]

[tool.coverage.run]
# No omits. The whole shipped package counts toward the floor; excluding the
# network-facing modules as "live-tested" would be a floor that measures
# nothing, because the live tests are opt-in and never run in CI.

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pyyaml>=6.0",
    # Floors match the revs pinned in .pre-commit-config.yaml. Ruff's formatter
    # is not stable across minors, so a contributor resolving an older ruff
    # would reformat files that CI then rejects.
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
