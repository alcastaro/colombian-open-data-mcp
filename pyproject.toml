[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colombian-open-data-mcp"
version = "0.1.0"
description = "MCP server for datos.gov.co — Colombia's open government data portal (Socrata, 10,000+ datasets)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Castillo Aroca" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "open-data",
    "datos-abiertos",
    "colombia",
    "socrata",
    "soda-api",
    "civic-tech",
    "gobierno-abierto",
    "mintic",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[project.scripts]
colombian-open-data-mcp = "colombian_open_data_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alcastaro/colombian-open-data-mcp"
Repository = "https://github.com/alcastaro/colombian-open-data-mcp"
Portal = "https://www.datos.gov.co"

[tool.hatch.build.targets.wheel]
packages = ["src/colombian_open_data_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "live: hits the real datos.gov.co Socrata API (skipped by default)",
]
