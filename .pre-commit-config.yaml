# These revs must match the versions CI resolves, not merely be "recent".
# Ruff's formatter changes between minors: a hook pinned older than the CI
# toolchain reformats files one way and `ruff format --check` then fails them,
# so the hook and the build fight each other on every commit. Bump these
# together with the floors in [dependency-groups].dev.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-error-summary]
        files: ^src/
